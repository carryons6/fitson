name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Jobs opt in to only the permissions they need. In particular, untrusted
# build tooling never receives the token used to publish a release.
permissions: {}

jobs:
  windows-build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download and verify pinned Miniforge bootstrap
        id: miniforge
        shell: powershell
        env:
          MINIFORGE_URL: https://github.com/conda-forge/miniforge/releases/download/26.3.2-3/Miniforge3-26.3.2-3-Windows-x86_64.exe
          MINIFORGE_SHA256: 14a8635465b5190537ddad6286746ffebbc55a1ed2a7bb14a506595fe3191e1e
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "Miniforge3-26.3.2-3-Windows-x86_64.exe"
          Invoke-WebRequest -UseBasicParsing -Uri $env:MINIFORGE_URL -OutFile $installer
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:MINIFORGE_SHA256) {
            throw "Miniforge bootstrap hash mismatch: expected $env:MINIFORGE_SHA256, got $actual."
          }
          $installerUrl = ([System.Uri](Resolve-Path -LiteralPath $installer).Path).AbsoluteUri
          "installer-url=$installerUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          activate-environment: astroview
          auto-activate-base: false
          auto-update-conda: false
          environment-file: environment-win-64.conda.lock
          installer-url: ${{ steps.miniforge.outputs.installer-url }}
      - name: Verify release tag matches VERSION
        if: github.ref_type == 'tag'
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts\verify_release_tag.py --tag "$env:RELEASE_TAG"
      - name: Validate locked build environment
        shell: powershell
        run: python -m pip check
      - name: Run tests
        shell: powershell
        run: python -m unittest discover -s tests -v
      - name: Download, verify, and install pinned Inno Setup
        shell: powershell
        env:
          INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_1/innosetup-6.7.1.exe
          INNO_SETUP_SHA256: 4d11e8050b6185e0d49bd9e8cc661a7a59f44959a621d31d11033124c4e8a7b0
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.1.exe"
          Invoke-WebRequest -UseBasicParsing -Uri $env:INNO_SETUP_URL -OutFile $installer
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:INNO_SETUP_SHA256) {
            throw "Inno Setup installer hash mismatch: expected $env:INNO_SETUP_SHA256, got $actual."
          }
          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/ALLUSERS" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }
      - name: Build, smoke-test, and package Windows release
        shell: powershell
        run: .\scripts\build_windows.ps1 -SkipTests -CondaLockPath environment-win-64.conda.lock
      - name: Verify release checksum exists
        shell: powershell
        run: |
          if (-not (Test-Path -LiteralPath "installer_output\SHA256SUMS.txt")) {
            throw "Release checksum manifest was not produced."
          }
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: astroview-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            dist\AstroView\**
            installer_output\AstroView_Setup_*.exe
            installer_output\SHA256SUMS.txt
            RELEASE_NOTES.md

  publish-release:
    if: github.ref_type == 'tag'
    needs: windows-build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: astroview-windows
          path: release-assets
      - name: Verify downloaded release checksum
        shell: bash
        working-directory: release-assets/installer_output
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release-assets/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release-assets/installer_output/AstroView_Setup_*.exe
            release-assets/installer_output/SHA256SUMS.txt
